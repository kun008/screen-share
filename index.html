
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ScreenShare - 在线屏幕共享</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#fff;font-family:Arial,"Microsoft YaHei",sans-serif}
header{padding:22px 7%;border-bottom:1px solid #263047;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:bold;color:#65a5ff}
.status{color:#9caac3;font-size:13px}
main{max-width:1050px;margin:45px auto;padding:0 20px}
h1{font-size:36px;margin-bottom:10px}
.sub{color:#9caac3;margin-bottom:35px}
.panel{background:#151e32;border:1px solid #293650;border-radius:16px;padding:25px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
label{display:block;color:#b8c5dc;margin-bottom:10px}
select{width:100%;padding:13px;background:#0c1426;color:white;border:1px solid #394963;border-radius:8px}
button{padding:13px 20px;border:0;border-radius:8px;cursor:pointer;font-weight:bold}
.primary{background:#3985ff;color:white}
.secondary{background:#293650;color:white}
button:disabled{opacity:.4;cursor:not-allowed}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
video{width:100%;max-height:530px;background:#050914;border-radius:12px;display:block}
#placeholder{text-align:center;padding:90px 10px;color:#8e9bb2}
#message{color:#9eb9e8;margin-top:15px}
.stats{display:flex;gap:25px;color:#aab9d2;margin-top:16px;flex-wrap:wrap}
@media(max-width:600px){.grid{grid-template-columns:1fr}h1{font-size:28px}}
</style>
</head>
<body>
<header>
  <div class="logo">◈ ScreenShare</div>
  <div class="status">● 在线屏幕共享平台</div>
</header>
<main>
  <h1>分享你的屏幕</h1>
  <p class="sub">简单、清晰、实时的屏幕共享体验</p>

  <section class="panel">
    <h2>共享设置</h2>
    <div class="grid">
      <div>
        <label for="resolution">屏幕分辨率</label>
        <select id="resolution">
          <option value="720">1280 × 720 (720p)</option>
          <option value="1080" selected>1920 × 1080 (1080p)</option>
          <option value="1440">2560 × 1440 (2K)</option>
          <option value="2160">3840 × 2160 (4K)</option>
          <option value="native">设备原始分辨率</option>
        </select>
      </div>
      <div>
        <label for="fps">目标帧率</label>
        <select id="fps">
          <option value="15">15 FPS</option>
          <option value="30">30 FPS</option>
          <option value="60" selected>60 FPS</option>
        </select>
      </div>
    </div>
    <div class="actions">
      <button class="primary" id="start">开始共享屏幕</button>
      <button class="secondary" id="stop" disabled>停止共享</button>
    </div>
    <p id="message">等待开始共享。请使用支持屏幕捕获的浏览器。</p>
  </section>

  <section class="panel">
    <h2>屏幕预览</h2>
    <div id="placeholder">尚未开始共享<br><br>点击上方按钮选择要分享的屏幕</div>
    <video id="preview" autoplay playsinline muted style="display:none"></video>
    <div class="stats">
      <span>实际分辨率：<b id="actualResolution">-</b></span>
      <span>目标帧率：<b id="actualFps">-</b></span>
    </div>
  </section>

  <section class="panel">
    <h2>分享链接</h2>
    <p style="color:#9caac3">下一阶段将接入实时传输服务器，生成可供其他人观看的专属链接。</p>
    <button class="secondary" disabled>分享链接（即将开放）</button>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let stream = null;

async function startSharing(){
  if(!navigator.mediaDevices?.getDisplayMedia){
    $('message').textContent='当前浏览器不支持屏幕共享，请使用最新版 Chrome 或 Edge，并通过 HTTPS 访问。';
    return;
  }

  try{
    const height = $('resolution').value;
    const fps = Number($('fps').value);
    const video = height === 'native' ? true : {
      width:{ideal:height==='720'?1280:height==='1080'?1920:height==='1440'?2560:3840},
      height:{ideal:Number(height)},
      frameRate:{ideal:fps}
    };

    stream = await navigator.mediaDevices.getDisplayMedia({
      video:video,
      audio:false
    });

    $('preview').srcObject=stream;
    $('preview').style.display='block';
    $('placeholder').style.display='none';
    $('start').disabled=true;
    $('stop').disabled=false;

    const track=stream.getVideoTracks()[0];
    const settings=track.getSettings();
    $('actualResolution').textContent=
      (settings.width||'?')+' × '+(settings.height||'?');
    $('actualFps').textContent=(settings.frameRate||fps)+' FPS';
    $('message').textContent='屏幕正在本地预览。远程观看功能将在接入服务器后开放。';

    track.onended=stopSharing;
  }catch(error){
    $('message').textContent='共享未能启动：'+error.message;
  }
}

function stopSharing(){
  if(stream) stream.getTracks().forEach(track=>track.stop());
  stream=null;
  $('preview').srcObject=null;
  $('preview').style.display='none';
  $('placeholder').style.display='block';
  $('start').disabled=false;
  $('stop').disabled=true;
  $('actualResolution').textContent='-';
  $('actualFps').textContent='-';
  $('message').textContent='共享已停止。';
}

$('start').onclick=startSharing;
$('stop').onclick=stopSharing;
</script>
</body>
</html>
